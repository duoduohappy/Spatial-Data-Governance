    source_line_start: 9
    source_line_end: 9
    source_quote: "A3. 字段类型必须符合数据字典声明；日期时间字段采用 ISO8601 格式。"
    required_for_release: true
    support_status: "SUPPORTED"
    interpretation: "本项目采用 ISO8601 的 RFC3339 子集：必须带 T 分隔符与显式时区（Z 或 ±HH:MM）。这是本项目采用的格式子集，不是 ISO8601 标准的全部。"
  -
    requirement_id: "A4"
